model_name: Qwen/Qwen2.5-VL-3B-Instruct
task_name: asl_citizen
output_dir: outputs/asl_citizen_qwen25vl_3b_qlora
train_jsonl: data/asl_citizen_train.jsonl
val_jsonl: data/asl_citizen_val.jsonl
id_column: id
video_column: video_path
target_column: label

prompt: "Recognize the isolated American Sign Language sign in this video. Output only the sign label."

video_fps: 2
max_frames: 16

baseline_max_eval_samples: 100
train_max_samples: 1000
eval_max_samples: 200

num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 0.0
warmup_ratio: 0.03
max_grad_norm: 1.0

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true
bf16: true
fp16: false
gradient_checkpointing: true

target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

generation:
  max_new_tokens: 16
  do_sample: false
  temperature: 0.0
