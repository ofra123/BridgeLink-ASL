<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
    <defs>
      <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0C1020"/>
        <stop offset="100%" stop-color="#121A2C"/>
      </linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#bg-dark)"/>
    <rect x="42" y="42" width="1516" height="816" rx="34" stroke="#263247" stroke-width="2"/>
    <circle cx="180" cy="120" r="260" fill="#FF8A5B" opacity="0.22" /><circle cx="1320" cy="170" r="300" fill="#6AA6FF" opacity="0.18" /><text x="110" y="118" font-family="Fraunces, Georgia, Times New Roman, serif" font-size="56" fill="#F8F3EA" font-weight="700">BridgeLink ASL Pipeline</text><text x="110" y="166" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#C9D0E0">The deployed demo uses MediaPipe landmarks plus a trained temporal CNN. The VLM stays off the live path and acts only as a comparison reranker.</text><rect x="110" y="105" width="310" height="62" rx="31" fill="#162133" stroke="#2B3850" stroke-width="2"/><text x="134" y="130" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9AB0D0" font-weight="600">EVALUATION SET</text><text x="134" y="152" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F8F3EA" font-weight="600">36 clips / 22 classes</text><rect x="470" y="105" width="310" height="62" rx="31" fill="#162133" stroke="#2B3850" stroke-width="2"/><text x="494" y="130" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9AB0D0" font-weight="600">LIVE DEMO MODEL</text><text x="494" y="152" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F8F3EA" font-weight="600">WLASL-25 landmark CNN</text><rect x="855" y="105" width="310" height="62" rx="31" fill="#162133" stroke="#2B3850" stroke-width="2"/><text x="879" y="130" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9AB0D0" font-weight="600">COMPARISON MODEL</text><text x="879" y="152" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F8F3EA" font-weight="600">Local Qwen2.5-VL reranker</text><rect x="90" y="250" width="250" height="180" rx="28" fill="#11192A" stroke="#2A3650" stroke-width="2"/><rect x="114" y="274" width="72" height="8" rx="4" fill="#FF8A5B"/><text x="114" y="322" font-family="Fraunces, Georgia, Times New Roman, serif" font-size="34" fill="#F8F3EA" font-weight="700">Input</text><text x="114" y="368" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Live webcam</text><text x="114" y="402" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">or 2-5 second clip</text><rect x="390" y="180" width="300" height="250" rx="28" fill="#11192A" stroke="#2A3650" stroke-width="2"/><rect x="414" y="204" width="72" height="8" rx="4" fill="#F2C94C"/><text x="414" y="252" font-family="Fraunces, Georgia, Times New Roman, serif" font-size="34" fill="#F8F3EA" font-weight="700">Per-frame perception</text><text x="414" y="298" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">MediaPipe Holistic</text><text x="414" y="332" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">33 pose + 21 left hand + 21 right hand</text><text x="414" y="366" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">225-D landmark vector per frame</text><rect x="740" y="160" width="320" height="270" rx="28" fill="#11192A" stroke="#2A3650" stroke-width="2"/><rect x="764" y="184" width="72" height="8" rx="4" fill="#2DCEB1"/><text x="764" y="232" font-family="Fraunces, Georgia, Times New Roman, serif" font-size="34" fill="#F8F3EA" font-weight="700">Temporal modeling</text><text x="764" y="278" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Rolling 32-frame buffer</text><text x="764" y="312" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Temporal landmark CNN</text><text x="764" y="346" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">WLASL-25 for demo</text><text x="764" y="380" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">WLASL-100 for report experiment</text><rect x="1110" y="180" width="320" height="250" rx="28" fill="#11192A" stroke="#2A3650" stroke-width="2"/><rect x="1134" y="204" width="72" height="8" rx="4" fill="#6AA6FF"/><text x="1134" y="252" font-family="Fraunces, Georgia, Times New Roman, serif" font-size="34" fill="#F8F3EA" font-weight="700">Output + comparison</text><text x="1134" y="298" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Top-1 sign caption</text><text x="1134" y="332" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Top-5 candidates</text><text x="1134" y="366" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Optional Qwen2.5-VL reranker</text><text x="1134" y="400" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#D8DDE8">Speech + Hugging Face Space UI</text><line x1="340" y1="340" x2="390" y2="305" stroke="#F7F1E8" stroke-width="5" stroke-linecap="round"/><polygon points="390,305 382.1353735630172,325.15310524476837 368.3722772982973,305.4915391523114" fill="#F7F1E8"/><line x1="690" y1="305" x2="740" y2="295" stroke="#F7F1E8" stroke-width="5" stroke-linecap="round"/><polygon points="740,295 724.7029414592217,310.2970585407784 719.9961542159052,286.7631223241963" fill="#F7F1E8"/><line x1="1060" y1="295" x2="1110" y2="305" stroke="#F7F1E8" stroke-width="5" stroke-linecap="round"/><polygon points="1110,305 1089.9961542159053,313.2368776758037 1094.7029414592216,289.7029414592216" fill="#F7F1E8"/><rect x="1060" y="560" width="430" height="170" rx="28" fill="#111827" opacity="0.94"/><text x="1088" y="602" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#F7F1E8" font-weight="700">PRESENTATION TALKING POINT</text><text x="1088" y="642" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F7F1E8">Train the CNN ourselves. Use the local VLM only to</text><text x="1088" y="672" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F7F1E8">rerank the CNN's top-5 labels. That keeps the live demo</text><text x="1088" y="702" font-family="Aptos, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#F7F1E8">fast and makes the comparison academically honest.</text></svg>